<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Page</title>

  <!-- Integrate CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="canary-beacon" aria-hidden="true"></div>
  <main class="container">
    <header class="header">
      <h1>Welcome</h1>
      <p class="subtitle">Static page hosted on GitHub Pages</p>
    </header>

    <section class="card">
      <h2>Login</h2>
      <form class="form" action="#" method="post" autocomplete="off">
        <label>
          Username
          <input type="text" name="username" placeholder="Enter username" />
        </label>

        <label>
          Password
          <input type="password" name="password" placeholder="Enter password" />
        </label>

        <button class="btn" type="submit">Sign in</button>
      </form>

      <p class="note">
        Note: This is a demo static page. No backend authentication.
      </p>
    </section>
  </main>
</body>
</html>
